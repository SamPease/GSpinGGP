name = "GSpinGGP"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GSpinGGP"]
# Mathlib declares `requiresModuleSystem`; our files do not use the module system yet. This
# silences Lake's per-import warning, which it otherwise repeats for every transitive import.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Mathlib comes through Tau Ceti, at the commit pinned in Tau Ceti's manifest.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "b608709b45f23ccda55703d572b0adb1fdec30fd"

[[lean_lib]]
name = "GSpinGGP"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

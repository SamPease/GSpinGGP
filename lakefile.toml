name = "GSpinGGP"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GSpinGGP"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Mathlib comes through Tau Ceti, at the commit pinned in Tau Ceti's manifest.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "580580ea8726c50dcf98e199fa0a7caef5a74302"

[[lean_lib]]
name = "GSpinGGP"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1

      # Build the blueprint (web + PDF) into site/, next to the static landing page.
      # These are the steps of leanprover-community/docgen-action, except that pygraphviz is
      # installed without `--global-option` (removed from recent pip, which breaks that action).
      # API docs are not built: for a Mathlib-based project they exceed the runner's memory.
      - name: Build blueprint
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d # v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory $GITHUB_WORKSPACE
            git config --global --add safe.directory `pwd`
            python3 -m venv env
            source env/bin/activate
            pip install requests wheel
            pip install pygraphviz
            pip install leanblueprint
            leanblueprint pdf
            mkdir -p site
            cp blueprint/print/print.pdf site/blueprint.pdf
            leanblueprint web
            cp -r blueprint/web site/blueprint

      - name: Check that the blueprint's Lean declarations exist
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

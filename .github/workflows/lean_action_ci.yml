name: Lean Action CI

# One run per change: pull requests are built as merged into `main` (the `pull_request` event),
# and `main` itself is built after every merge. Branch pushes without a pull request are not built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false
      # Prebuilt Mathlib and Tau Ceti outputs; without them Tau Ceti would be compiled from source.
      - name: Fetch build caches
        run: PATH="$HOME/.elan/bin:$PATH" bash scripts/get-cache.sh
      # Pull requests start from the compiled project of the latest run on `main`, so that Lake recompiles only the modules that changed and those importing
      # them. `main` is always compiled from scratch, and its result is what later runs start from.
      - name: Restore the compiled project (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: project-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            project-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      # Compiled files of modules whose source no longer exists (deleted or renamed since the restored run).
      - name: Remove compiled files without a source
        if: github.event_name == 'pull_request'
        run: |
          if [ -d .lake/build/lib/lean ]; then
            find .lake/build/lib/lean -type f | while read -r f; do
              rel="${f#.lake/build/lib/lean/}"
              [ -f "${rel%%.*}.lean" ] || rm -f "$f"
            done
          fi
      - name: Build
        run: |
          set -o pipefail
          ~/.elan/bin/lake build 2>&1 | tee build.log
      # Not part of the check: a failure to save (for instance when a run is repeated on the same
      # commit, whose entry already exists) only makes later runs compile more.
      - name: Save the compiled project (main)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: project-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
      # Axioms only in Literature/, local_ggp's axioms as listed in scripts/main-axioms.txt, and the
      # README's sorry and axiom counts up to date.
      - name: Check assumptions and README counts
        run: LAKE=~/.elan/bin/lake bash scripts/check-assumptions.sh build.log

      # Build the blueprint (web + PDF) into site/, next to the static landing page.
      # These are the steps of leanprover-community/docgen-action, except that pygraphviz is
      # installed with LDFLAGS instead of `--global-option` (removed from recent pip, which breaks that action).
      # API docs are not built: for a Mathlib-based project they exceed the runner's memory.
      - name: Build blueprint
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d # v2
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250401
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory $GITHUB_WORKSPACE
            git config --global --add safe.directory `pwd`
            python3 -m venv env
            source env/bin/activate
            pip install requests wheel
            LDFLAGS="-L/usr/lib/graphviz -Wl,-rpath,/usr/lib/graphviz" pip install pygraphviz
            pip install leanblueprint
            leanblueprint pdf
            mkdir -p site
            cp blueprint/print/print.pdf site/blueprint.pdf
            leanblueprint web
            cp -r blueprint/web site/blueprint

      - name: Check that the blueprint's Lean declarations exist
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
